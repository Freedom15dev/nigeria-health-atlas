# Theme from DESIGN.md section 1. Inter for text, Space Grotesk (700) for headings, from Google Fonts.
[theme]
primaryColor = "#3E9A63"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#0F1E33"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
borderColor = "#E3E6EB"
baseRadius = "12px"

[client]
toolbarMode = "minimal"

[server]
headless = true
